<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="620" height="250" font-family="Segoe UI, Arial, sans-serif"><rect x="10" y="8" width="600" height="46" rx="0" fill="#1c2433" stroke="#ffffff" stroke-width="1.5"/><text x="24" y="24" font-size="14" fill="#ffffff" text-anchor="start" font-weight="800" dominant-baseline="middle">Exosphere</text><text x="24" y="42" font-size="11" fill="#ffffff" text-anchor="start" font-weight="600" dominant-baseline="middle">above ~600 km</text><text x="190" y="31" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600" dominant-baseline="middle">fades into space</text><rect x="10" y="54" width="600" height="46" rx="0" fill="#28344a" stroke="#ffffff" stroke-width="1.5"/><text x="24" y="70" font-size="14" fill="#ffffff" text-anchor="start" font-weight="800" dominant-baseline="middle">Thermosphere</text><text x="24" y="88" font-size="11" fill="#ffffff" text-anchor="start" font-weight="600" dominant-baseline="middle">~85–600 km</text><text x="190" y="77" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600" dominant-baseline="middle">very thin, very hot air; auroras; the space station orbits here</text><rect x="10" y="100" width="600" height="46" rx="0" fill="#3b5578" stroke="#ffffff" stroke-width="1.5"/><text x="24" y="116" font-size="14" fill="#ffffff" text-anchor="start" font-weight="800" dominant-baseline="middle">Mesosphere</text><text x="24" y="134" font-size="11" fill="#ffffff" text-anchor="start" font-weight="600" dominant-baseline="middle">~50–85 km</text><text x="190" y="123" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600" dominant-baseline="middle">meteors burn up; the coldest layer</text><rect x="10" y="146" width="600" height="46" rx="0" fill="#6f95c4" stroke="#ffffff" stroke-width="1.5"/><text x="24" y="162" font-size="14" fill="#ffffff" text-anchor="start" font-weight="800" dominant-baseline="middle">Stratosphere</text><text x="24" y="180" font-size="11" fill="#ffffff" text-anchor="start" font-weight="600" dominant-baseline="middle">~12–50 km</text><text x="190" y="169" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600" dominant-baseline="middle">the ozone layer absorbs UV light</text><rect x="10" y="192" width="600" height="46" rx="0" fill="#bcd6ef" stroke="#ffffff" stroke-width="1.5"/><text x="24" y="208" font-size="14" fill="#23272e" text-anchor="start" font-weight="800" dominant-baseline="middle">Troposphere</text><text x="24" y="226" font-size="11" fill="#23272e" text-anchor="start" font-weight="600" dominant-baseline="middle">0–12 km</text><text x="190" y="215" font-size="12" fill="#23272e" text-anchor="start" font-weight="600" dominant-baseline="middle">where we live; almost all weather happens here</text><polygon points="470,238 520,200 548,222 570,196 606,238" fill="#7d8a6a" stroke="#5b6648" stroke-width="1" stroke-linejoin="round"/></svg>