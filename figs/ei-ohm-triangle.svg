<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" font-family="Segoe UI, Arial, sans-serif"><polygon points="110,20 25,170 195,170" fill="#ffffff" stroke="#df6d12" stroke-width="2.6" stroke-linejoin="round"/><line x1="53" y1="120" x2="167" y2="120" stroke="#df6d12" stroke-width="2" stroke-linecap="round"/><line x1="110" y1="120" x2="110" y2="170" stroke="#df6d12" stroke-width="2" stroke-linecap="round"/><text x="110" y="84" font-size="30" fill="#df6d12" text-anchor="middle" font-weight="800" dominant-baseline="middle">E</text><text x="80" y="148" font-size="26" fill="#df6d12" text-anchor="middle" font-weight="800" dominant-baseline="middle">I</text><text x="140" y="148" font-size="26" fill="#df6d12" text-anchor="middle" font-weight="800" dominant-baseline="middle">R</text><polygon points="390,20 305,170 475,170" fill="#ffffff" stroke="#2f6cb3" stroke-width="2.6" stroke-linejoin="round"/><line x1="333" y1="120" x2="447" y2="120" stroke="#2f6cb3" stroke-width="2" stroke-linecap="round"/><line x1="390" y1="120" x2="390" y2="170" stroke="#2f6cb3" stroke-width="2" stroke-linecap="round"/><text x="390" y="84" font-size="30" fill="#2f6cb3" text-anchor="middle" font-weight="800" dominant-baseline="middle">P</text><text x="360" y="148" font-size="26" fill="#2f6cb3" text-anchor="middle" font-weight="800" dominant-baseline="middle">I</text><text x="420" y="148" font-size="26" fill="#2f6cb3" text-anchor="middle" font-weight="800" dominant-baseline="middle">E</text><text x="110" y="192" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="700" dominant-baseline="middle">Ohm's law</text><text x="390" y="192" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="700" dominant-baseline="middle">Power</text><text x="212" y="70" font-size="14" fill="#df6d12" text-anchor="start" font-weight="800" dominant-baseline="middle">E = I × R</text><text x="212" y="100" font-size="14" fill="#df6d12" text-anchor="start" font-weight="800" dominant-baseline="middle">I = E ÷ R</text><text x="212" y="130" font-size="14" fill="#df6d12" text-anchor="start" font-weight="800" dominant-baseline="middle">R = E ÷ I</text><text x="492" y="70" font-size="14" fill="#2f6cb3" text-anchor="start" font-weight="800" dominant-baseline="middle">P = I × E</text><text x="492" y="100" font-size="14" fill="#2f6cb3" text-anchor="start" font-weight="800" dominant-baseline="middle">I = P ÷ E</text><text x="492" y="130" font-size="14" fill="#2f6cb3" text-anchor="start" font-weight="800" dominant-baseline="middle">E = P ÷ I</text></svg>