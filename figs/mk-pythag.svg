<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="500" height="230" font-family="Segoe UI, Arial, sans-serif"><polygon points="70,200 70,50 330,200" fill="#dce9f8" stroke="#23272e" stroke-width="2.4" stroke-linejoin="round"/><polyline points="70,184 86,184 86,200" fill="none" stroke="#23272e" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="125" font-size="17" fill="#23272e" text-anchor="middle" font-weight="800" dominant-baseline="middle" font-style="italic">a</text><text x="200" y="218" font-size="17" fill="#23272e" text-anchor="middle" font-weight="800" dominant-baseline="middle" font-style="italic">b</text><text x="212" y="112" font-size="17" fill="#df6d12" text-anchor="middle" font-weight="800" dominant-baseline="middle" font-style="italic">c</text><text x="232" y="132" font-size="12" fill="#df6d12" text-anchor="start" font-weight="700" dominant-baseline="middle" transform="rotate(30 232 132)">hypotenuse</text><text x="410" y="60" font-size="19" fill="#23272e" text-anchor="middle" font-weight="800" dominant-baseline="middle">a² + b² = c²</text><text x="410" y="88" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="600" dominant-baseline="middle">legs: a and b</text><text x="410" y="106" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="600" dominant-baseline="middle">c is always the longest side</text></svg>